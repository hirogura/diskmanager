<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.M.A.R.T.情報 - Disk Manager</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1e293b;padding:16px 24px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:16px}
.header h1{font-size:1.4em;color:#38bdf8}
.header .version{color:#94a3b8;font-size:0.85em;font-weight:normal;padding-top:4px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-header{padding:6px 14px;border:none;border-radius:6px;background:#334155;color:#e2e8f0;font-size:0.82em;cursor:pointer;transition:all 0.2s}
.btn-header:hover{background:#475569}
.btn-header:disabled{opacity:0.5;cursor:not-allowed}
.main{max-width:1000px;margin:0 auto;padding:24px}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:20px;margin-bottom:20px}
.card h2{font-size:1.1em;color:#38bdf8;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.info{background:rgba(56,189,248,0.08);border:1px solid #0e7490;border-radius:8px;padding:12px 16px;margin-bottom:20px;color:#a5f3fc;font-size:0.88em;line-height:1.7}
.dev{border:1px solid #475569;border-radius:8px;padding:14px;margin-bottom:12px;background:#0f172a}
.dev-path{font-size:1.05em;font-weight:bold;color:#e2e8f0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dev-meta{font-size:0.85em;color:#94a3b8;margin-top:4px;line-height:1.6}
.dev-meta .serial{color:#7dd3fc;font-family:'Fira Code',monospace}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.78em;font-weight:bold}
.badge-ok{background:rgba(34,197,94,0.2);color:#22c55e}
.badge-ng{background:rgba(220,38,38,0.2);color:#f87171}
.badge-unknown{background:rgba(100,116,139,0.2);color:#94a3b8}
.badge-loading{background:rgba(56,189,248,0.2);color:#38bdf8}
.smart-body{margin-top:12px}
.kv-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:0.85em}
.kv-table th,.kv-table td{border:1px solid #334155;padding:5px 8px;text-align:left}
.kv-table th{background:#1e293b;color:#94a3b8;white-space:nowrap;width:220px}
.kv-table td{font-family:'Fira Code',monospace;color:#cbd5e1;word-break:break-all}
.attr-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:0.8em}
.attr-table th,.attr-table td{border:1px solid #334155;padding:5px 8px;text-align:left}
.attr-table th{background:#1e293b;color:#94a3b8}
.attr-table td{font-family:'Fira Code',monospace;color:#cbd5e1}
.attr-fail{color:#f87171;font-weight:bold}
.section-title{font-size:0.9em;color:#38bdf8;margin:14px 0 4px;font-weight:bold}
.err-msg{color:#f87171;font-size:0.88em;margin-top:8px}
.loading{color:#38bdf8;font-size:0.88em;margin-top:8px}
details{margin-top:10px}
details summary{cursor:pointer;color:#94a3b8;font-size:0.85em;padding:6px 0}
.raw-output{background:#000;border:1px solid #334155;border-radius:6px;padding:12px;font-family:'Fira Code',monospace;font-size:0.78em;color:#4ade80;max-height:400px;overflow-y:auto;white-space:pre-wrap;margin-top:8px;line-height:1.5}
.notify{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:6px;color:#fff;z-index:1000;animation:fadeIn 0.3s}
.notify.success{background:#16a34a}.notify.error{background:#dc2626}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
</style>
<link rel="stylesheet" href="/pane.css">
<script src="/pane.js"></script>
</head>
<body>
<div class="header">
    <h1>S.M.A.R.T.情報</h1>
        <div class="header-actions">
        <button class="btn-header pane-back" onclick="location.href='/'">レスキューに戻る</button>
        <button class="btn-header" onclick="location.reload()">リフレッシュ</button>
    </div>
</div>
<div class="main">
    <div class="info">
        接続されているディスクの一覧を表示し、S.M.A.R.T.情報を取得できるディスクはすべて自動で表示します。<br>
        取得できないディスク（S.M.A.R.T.非対応・USB変換で取得不可等）は理由を表示します。
    </div>

    <div class="card">
        <h2>接続ディスク一覧
            <button class="btn-header" style="margin-left:auto" onclick="loadDevices()">一覧を更新</button>
        </h2>
        <div id="dev-list">読み込み中...</div>
    </div>
</div>

<script>
function notify(msg, type) {
    const el = document.createElement('div');
    el.className = 'notify ' + type;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtNum(n) {
    if (n == null || isNaN(Number(n))) return esc(n);
    return Number(n).toLocaleString('en-US');
}

async function loadDevices() {
    const list = document.getElementById('dev-list');
    list.textContent = '読み込み中...';
    try {
        const res = await fetch('/api/smart-devices');
        const devices = await res.json();
        if (!devices.length) { list.textContent = 'デバイスが見つかりません'; return; }
        list.innerHTML = '';
        devices.forEach((d) => {
            const div = document.createElement('div');
            div.className = 'dev';
            div.id = 'dev-' + d.name.replace(/[^a-zA-Z0-9]/g, '_');
            div.innerHTML =
                '<div class="dev-path">' + esc(d.path) + ' — ' + esc(d.size || '') +
                ' <span class="badge badge-loading">S.M.A.R.T.取得中...</span></div>' +
                '<div class="dev-meta">モデル: ' + esc(d.model || '-') +
                ' / シリアル: <span class="serial">' + esc(d.serial || '-') + '</span><br>' +
                '接続: ' + esc(d.tran || '不明') + '</div>' +
                '<div class="smart-body"><div class="loading">取得中...</div></div>';
            list.appendChild(div);
            // 各ディスクの S.M.A.R.T. を順次取得（全ディスク分）
            fetchSmart(d, div);
        });
    } catch (e) {
        list.textContent = '取得エラー: ' + e.message;
        notify('デバイス一覧の取得に失敗しました', 'error');
    }
}

async function fetchSmart(d, container) {
    const body = container.querySelector('.smart-body');
    const badgeWrap = container.querySelector('.dev-path');
    try {
        const res = await fetch('/api/smart?path=' + encodeURIComponent(d.path));
        const info = await res.json();
        renderSmart(d, info, container, body, badgeWrap);
    } catch (e) {
        body.innerHTML = '<div class="err-msg">取得エラー: ' + esc(e.message) + '</div>';
        setBadge(badgeWrap, '取得失敗', 'badge-unknown');
    }
}

function setBadge(badgeWrap, text, cls) {
    const old = badgeWrap.querySelector('.badge');
    if (old) { old.textContent = text; old.className = 'badge ' + cls; }
}

function renderSmart(d, info, container, body, badgeWrap) {
    if (!info.available) {
        setBadge(badgeWrap, 'S.M.A.R.T.取得不可', 'badge-unknown');
        body.innerHTML = '<div class="err-msg">' + esc(info.error || 'S.M.A.R.T.情報を取得できません') + '</div>' +
            (info.output ? '<details><summary>smartctl 出力を見る</summary><div class="raw-output">' + esc(info.output) + '</div></details>' : '');
        return;
    }
    const data = info.data || {};
    const ok = info.health_ok;
    setBadge(badgeWrap,
        ok === true ? '正常' : ok === false ? '異常あり' : '状態: ' + (info.health || '不明'),
        ok === true ? 'badge-ok' : ok === false ? 'badge-ng' : 'badge-unknown');

    let html = '';
    html += buildSummary(data);
    html += buildAttrTable(data);
    html += buildNvmeTable(data);
    html += buildErrorLog(data);
    if (info.output) {
        html += '<details><summary>smartctl 全出力を見る</summary><div class="raw-output">' + esc(info.output) + '</div></details>';
    }
    body.innerHTML = html || '<div class="err-msg">表示できる項目がありません</div>';
}

// 基本情報サマリー（ATA / NVMe / SCSI 共通で存在する項目のみ表示）
function buildSummary(data) {
    const rows = [];
    const push = (k, v) => { if (v != null && v !== '') rows.push([k, v]); };
    push('モデル', data.model_name || data.scsi_model_name || '');
    push('ファミリー', data.model_family || '');
    push('シリアル', data.serial_number || data.scsi_serial_number || '');
    push('ファームウェア', data.firmware_version || '');
    if (data.device) push('プロトコル', (data.device.protocol || '') + (data.device.type ? ' / ' + data.device.type : ''));
    if (data.user_capacity && data.user_capacity.bytes != null)
        push('容量', fmtNum(data.user_capacity.bytes) + ' B');
    if (data.temperature && data.temperature.current != null) push('温度', data.temperature.current + ' ℃');
    if (data.power_on_time && data.power_on_time.hours != null) push('通電時間', fmtNum(data.power_on_time.hours) + ' 時間');
    if (data.power_cycle_count != null) push('電源投入回数', fmtNum(data.power_cycle_count) + ' 回');
    // NVMe 固有の代表値もサマリーに含める
    const nv = data.nvme_smart_health_information_log || {};
    if (nv.percentage_used != null) push('使用率 (Percentage Used)', nv.percentage_used + ' %');
    if (nv.available_spare != null) push('予備スペア残量', nv.available_spare + ' %');
    if (nv.media_errors != null) push('メディアエラー', fmtNum(nv.media_errors));
    if (rows.length === 0) return '';
    return '<div class="section-title">基本情報</div><table class="kv-table">' +
        rows.map(r => '<tr><th>' + esc(r[0]) + '</th><td>' + esc(String(r[1])) + '</td></tr>').join('') +
        '</table>';
}

// ATA アトリビュートテーブル
function buildAttrTable(data) {
    const attrs = data.ata_smart_attributes && data.ata_smart_attributes.table;
    if (!attrs || !attrs.length) return '';
    let html = '<div class="section-title">S.M.A.R.T. アトリビュート（ATA）</div>' +
        '<table class="attr-table"><tr><th>ID</th><th>項目</th><th>現在</th><th>最悪</th><th>しきい値</th><th>RAW値</th><th>状態</th></tr>';
    attrs.forEach(a => {
        const fail = a.when_failed && a.when_failed !== '' && a.when_failed !== '-';
        const rawStr = (a.raw && (a.raw.string || a.raw.value)) != null ? String(a.raw.string || a.raw.value) : '';
        html += '<tr><td>' + esc(a.id) + '</td><td>' + esc(a.name) + '</td><td>' + esc(a.value) +
            '</td><td>' + esc(a.worst) + '</td><td>' + esc(a.thresh) + '</td><td>' + esc(rawStr) +
            '</td><td>' + (fail ? '<span class="attr-fail">注意:' + esc(a.when_failed) + '</span>' : '-') + '</td></tr>';
    });
    return html + '</table>';
}

// NVMe ヘルスログ
function buildNvmeTable(data) {
    const nv = data.nvme_smart_health_information_log;
    if (!nv) return '';
    const labels = {
        temperature: '温度', available_spare: '予備スペア残量 (%)',
        available_spare_threshold: '予備スペアしきい値 (%)', percentage_used: '使用率 (%)',
        data_units_read: '読み込み量 (units)', data_units_written: '書き込み量 (units)',
        host_reads: 'ホスト読み込み', host_writes: 'ホスト書き込み',
        controller_busy_time: 'コントローラー稼働時間', power_cycles: '電源投入回数',
        power_on_hours: '通電時間', unsafe_shutdowns: '異常シャットダウン回数',
        media_errors: 'メディアエラー', num_err_log_entries: 'エラーログ件数',
        warning_temp_time: '高温警告時間', critical_comp_time: '危険温度時間',
        critical_warning: 'クリティカル警告',
    };
    let html = '<div class="section-title">NVMe ヘルス情報</div><table class="kv-table">';
    Object.keys(labels).forEach(k => {
        if (nv[k] != null) html += '<tr><th>' + esc(labels[k]) + '</th><td>' + esc(String(nv[k])) + '</td></tr>';
    });
    return html + '</table>';
}

// エラーログ概要
function buildErrorLog(data) {
    let html = '';
    const errLog = data.ata_smart_error_log && data.ata_smart_error_log.summary;
    if (errLog && (errLog.count != null || errLog.revision != null)) {
        html += '<div class="section-title">エラーログ</div><table class="kv-table">';
        if (errLog.count != null) html += '<tr><th>エラー件数</th><td>' + esc(String(errLog.count)) + '</td></tr>';
        if (errLog.revision != null) html += '<tr><th>リビジョン</th><td>' + esc(String(errLog.revision)) + '</td></tr>';
        html += '</table>';
    }
    const selftest = data.ata_smart_self_test_log && data.ata_smart_self_test_log.standard;
    if (selftest && (selftest.count != null)) {
        html += '<div class="section-title">セルフテスト</div><table class="kv-table">' +
            '<tr><th>実施回数</th><td>' + esc(String(selftest.count)) + '</td></tr></table>';
    }
    return html;
}

loadDevices();
</script>
</body>
</html>
